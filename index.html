// ---- sprite z obrysem (styl pixel-art: ciemny kontur 1px + błysk przy trafieniu) ----
const SW_=220,SH_=200,SOX=110,SOY=175;
const SC=document.createElement('canvas');SC.width=SW_;SC.height=SH_;const SX=SC.getContext('2d');
const OC=document.createElement('canvas');OC.width=SW_;OC.height=SH_;const OX=OC.getContext('2d');
function sprite(px,py,face,body,alpha=1,flash=false,outline='#0a0505'){
  SX.setTransform(1,0,0,1,0,0);SX.clearRect(0,0,SW_,SH_);SX.translate(SOX,SOY);
  const prev=ctx;ctx=SX;FL=false;try{body();}finally{ctx=prev;}
  OX.globalCompositeOperation='source-over';OX.clearRect(0,0,SW_,SH_);OX.drawImage(SC,0,0);
  OX.globalCompositeOperation='source-in';OX.fillStyle=outline;OX.fillRect(0,0,SW_,SH_);OX.globalCompositeOperation='source-over';
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha*=alpha;ctx.translate(Math.round(px),Math.round(py));ctx.scale(face,1);
  if(CFG.outline){ctx.drawImage(OC,-SOX-1,-SOY);ctx.drawImage(OC,-SOX+1,-SOY);ctx.drawImage(OC,-SOX,-SOY-1);ctx.drawImage(OC,-SOX,-SOY+1);}
  ctx.drawImage(SC,-SOX,-SOY);
  if(flash){OX.globalCompositeOperation='source-in';OX.fillStyle='#fff6ea';OX.fillRect(0,0,SW_,SH_);OX.globalCompositeOperation='source-over';ctx.globalAlpha*=0.85;ctx.drawImage(OC,-SOX,-SOY);}
  ctx.restore();
}
function fxAt(px,py,face,fn){ctx.save();ctx.translate(Math.round(px),Math.round(py));ctx.scale(face,1);fn();ctx.restore();}

const keys={},pressed={};
const MAP={ArrowLeft:['left'],KeyA:['left'],ArrowRight:['right'],KeyD:['right'],ArrowUp:['up','jump'],KeyW:['up','jump'],ArrowDown:['down'],KeyS:['down'],
Space:['jump'],KeyJ:['atk','ok'],KeyK:['heavy'],KeyL:['roll'],ShiftLeft:['roll'],ShiftRight:['roll'],KeyE:['heal'],KeyH:['heal'],KeyF:['use'],
Enter:['ok'],NumpadEnter:['ok'],Escape:['back','pause'],KeyP:['pause'],Digit1:['z1'],Digit2:['z2'],Digit3:['z3'],Digit4:['z4'],Digit5:['z5'],Digit6:['z6']};
addEventListener('keydown',e=>{const a=MAP[e.code];initAudio();if(!a)return;e.preventDefault();for(const k of a){if(!keys[k])pressed[k]=true;keys[k]=true;}});

let gpPrev={};
function pollPad(){
  let gp=null;try{const pads=navigator.getGamepads?navigator.getGamepads():[];gp=pads&&pads[0];}catch(e){}
  if(!gp)return;
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  const st={left:ax<-.4||b(14),right:ax>.4||b(15),up:ay<-.5||b(12),down:ay>.5||b(13),jump:b(0),roll:b(1),heal:b(2),use:b(3),atk:b(5),heavy:b(7),ok:b(9)||b(0)||b(5),back:b(8)||b(1),pause:b(9)};
  for(const k in st){if(st[k]&&!gpPrev[k])pressed[k]=true;if(st[k])keys[k]=true;else if(gpPrev[k])keys[k]=false;}
  gpPrev=st;
}

let lastTouch=('ontouchstart' in window)&&!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const touchOn=()=>CFG.touch==='on'||(CFG.touch==='auto'&&lastTouch);
const TB=[{id:'left',x:34,y:230,r:21,l:'◀'},{id:'right',x:84,y:230,r:21,l:'▶'},{id:'down',x:59,y:194,r:12,l:'▼'},
 {id:'jump',x:446,y:234,r:21,k:'bJump'},{id:'atk',x:402,y:250,r:17,k:'bAtk'},{id:'heavy',x:398,y:208,r:14,k:'bHeavy'},{id:'roll',x:446,y:190,r:15,k:'bRoll'},
 {id:'heal',x:358,y:252,r:13,k:'bHeal'},{id:'use',x:356,y:220,r:13,k:'bUse'},{id:'pause',x:262,y:16,r:11,l:'II'}];
const TP=new Map(),TH={};let UIH=[];
function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};}
function btnAt(x,y){let best=null,bd=1e9;for(const b of TB){const d=Math.hypot(x-b.x,y-b.y);if(d<b.r+8&&d<bd){bd=d;best=b.id;}}return best;}
function syncTouch(){const held=new Set(TP.values());for(const b of TB){const h=held.has(b.id);if(h&&!TH[b.id])pressed[b.id]=true;if(h)keys[b.id]=true;else if(TH[b.id])keys[b.id]=false;TH[b.id]=h;}}
function handleTap(x,y){for(let i=UIH.length-1;i>=0;i--){const h=UIH[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn(x,y);return;}}
  if(scene==='dead'&&deadT>70)respawn();else if(scene==='end')pressed.ok=true;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.focus();}catch(_){}initAudio();if(e.pointerType==='touch'||e.pointerType==='pen')lastTouch=true;
  const v=toV(e);
  if(touchOn()&&scene==='play'){const b=btnAt(v.x,v.y);if(b){TP.set(e.pointerId,b);try{cv.setPointerCapture(e.pointerId);}catch(_){}syncTouch();return;}}
  handleTap(v.x,v.y);},{passive:false});
cv.addEventListener('pointermove',e=>{if(!TP.has(e.pointerId))return;const v=toV(e),b=btnAt(v.x,v.y);if(b&&b!==TP.get(e.pointerId)&&b!=='pause'){TP.set(e.pointerId,b);syncTouch();}});
const tEnd=e=>{if(TP.delete(e.pointerId))syncTouch();};
cv.addEventListener('pointerup',tEnd);cv.addEventListener('pointercancel',tEnd);cv.addEventListener('lostpointercapture',tEnd);

// ================== DŹWIĘK ==================
let AC=null,NB=null,master=null,sfxBus=null,musBus=null,DIST=null;
function setVolumes(){if(!AC)return;sfxBus.gain.value=CFG.sfx/10*0.75;musBus.gain.value=CFG.mus/10*0.5;}
function impulse(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}return b;}
function distCurve(){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(x*9)*0.9;}return c;}
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);sfxBus=AC.createGain();sfxBus.connect(master);musBus=AC.createGain();setVolumes();
  try{const conv=AC.createConvolver();conv.buffer=impulse(2.6);const wet=AC.createGain();wet.gain.value=0.4;musBus.connect(conv);conv.connect(wet);wet.connect(master);}catch(e){}
  musBus.connect(master);DIST=distCurve();
  const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function tone(type,f0,f1,dur,vol,delay=0){const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,freq,type='lowpass',delay=0){const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+dur+0.02);}
function sfx(n){if(!AC)return;try{switch(n){
  case'swing':noise(.12,.25,2500,'bandpass');break;
  case'swing2':noise(.24,.35,1100,'bandpass');break;
  case'hit':tone('square',160,40,.12,.22);noise(.08,.3,900);break;
  case'clang':tone('triangle',1400,900,.25,.2);tone('square',2100,1800,.08,.07);break;
  case'roll':noise(.18,.2,500);break;
  case'jump':tone('sine',220,330,.08,.07);break;
  case'hurt':tone('sawtooth',300,90,.2,.2);noise(.1,.25,700);break;
  case'heal':tone('sine',440,880,.4,.12);tone('sine',660,1320,.4,.06,.05);break;
  case'death':tone('sawtooth',180,30,1.6,.25);noise(1.2,.15,300);break;
  case'bonfire':noise(.8,.2,600);tone('sine',300,600,.6,.06);break;
  case'souls':tone('sine',880,1760,.25,.07);break;
  case'shoot':noise(.1,.15,3000,'highpass');break;
  case'fire':noise(.5,.25,800);tone('sawtooth',90,60,.4,.1);break;
  case'slam':tone('sine',90,30,.5,.4);noise(.4,.35,400);break;
  case'roar':tone('sawtooth',110,55,.9,.22);noise(.8,.2,500);break;
  case'boss':tone('sawtooth',55,52,2.5,.12);tone('sine',110,108,2.5,.1);break;
  case'toll':tone('sine',196,194,2.2,.25);tone('sine',466,462,1.6,.1);tone('sine',784,780,1,.05);break;
  case'shriek':tone('sawtooth',900,1400,.6,.08);tone('square',1300,700,.6,.05);noise(.6,.2,3000,'highpass');break;
  case'victory':[392,494,587,784].forEach((f,i)=>tone('sine',f,f,1.4,.09,i*.18));break;
  case'select':tone('square',600,600,.05,.04);break;
  case'deny':tone('square',160,120,.12,.06);break;
}}catch(e){}}

const mf=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,h,r,v){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+a+h);g.gain.linearRampToValueAtTime(0.0001,t+a+h+r);}
function osc(type,f,t,dur,dest,det=0){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;o.connect(dest);o.start(t);o.stop(t+dur+0.05);return o;}
function iChoir(t,notes,dur,vol,out,vow='a'){
  const F={a:[800,1150,2900],o:[450,800,2830],u:[325,700,2530],e:[400,1700,2600]}[vow];
  const g=AC.createGain();env(g,t,dur*0.3,dur*0.4,dur*0.3,vol);g.connect(out);
  const mix=AC.createGain();mix.gain.value=0.5;
  F.forEach((f,i)=>{const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=5+i*3;const fg=AC.createGain();fg.gain.value=[1,.5,.2][i];mix.connect(b);b.connect(fg);fg.connect(g);});
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=4.8;lg.gain.value=10;lfo.connect(lg);lfo.start(t);lfo.stop(t+dur+.05);
  for(const m of notes)for(const d of[-9,0,9]){const o=osc('sawtooth',mf(m),t,dur,mix,d+rnd(-3,3));lg.connect(o.detune);}
}
function iOrgan(t,notes,dur,vol,out){const g=AC.createGain();env(g,t,0.08,Math.max(0.1,dur-0.35),0.25,vol);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.connect(g);g.connect(out);
  for(const m of notes){const f=mf(m);osc('sine',f,t,dur,lp);const h=AC.createGain();h.gain.value=.4;h.connect(lp);osc('sine',f*2,t,dur,h);const h3=AC.createGain();h3.gain.value=.15;h3.connect(lp);osc('triangle',f*3,t,dur,h3);}}
function iBell(t,m,vol,out,dec=3){const f=mf(m);[1,2.76,5.4,8.93].forEach((k,i)=>{const g=AC.createGain();g.gain.setValueAtTime(vol/(i+1),t);g.gain.exponentialRampToValueAtTime(0.0001,t+dec/(1+i*0.6));g.connect(out);osc('sine',f*k,t,dec,g);});}
function iPluck(t,m,vol,out){const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(450,t+0.35);lp.connect(g);g.connect(out);osc('sawtooth',mf(m),t,1.1,lp);osc('triangle',mf(m)*2,t,1.1,lp);}
function iDrone(t,m,dur,vol,out){const g=AC.createGain();env(g,t,dur*0.3,dur*0.4,dur*0.3,vol);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.connect(g);g.connect(out);osc('sawtooth',mf(m),t,dur,lp,-6);osc('sawtooth',mf(m),t,dur,lp,6);osc('sine',mf(m-12),t,dur,lp);}
function iGtr(t,m,dur,vol,out,mute){const pre=AC.createGain();pre.gain.value=0.5;const ws=AC.createWaveShaper();ws.curve=DIST;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=mute?1300:3000;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  pre.connect(ws);ws.connect(lp);lp.connect(g);g.connect(out);const f=mf(m);for(const k of[1,1.4983,2])for(const d of[-10,10])osc('sawtooth',f*k,t,dur,pre,d);}
function iBass(t,m,dur,vol,out){const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;lp.connect(g);g.connect(out);osc('sawtooth',mf(m),t,dur,lp);}
function iKick(t,vol,out){const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);g.connect(out);const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);o.connect(g);o.start(t);o.stop(t+0.25);}
function iNoise(t,dur,vol,out,type,freq){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}
function iSnare(t,vol,out){iNoise(t,0.16,vol,out,'bandpass',1900);const g=AC.createGain();g.gain.setValueAtTime(vol*0.6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);g.connect(out);osc('triangle',190,t,0.1,g);}
function iHat(t,vol,out,open){iNoise(t,open?0.25:0.05,vol,out,'highpass',7000);}

function mkAmbient(d,seed){const r=mulberry(seed);return{bpm:d.bpm,play(step,t,spb,out){
  const bar=Math.floor(step/16),s=step%16,[root,q]=d.prog[bar%d.prog.length],ch=triad(root+12,q),bl=16*spb;
  if(s===0){
    if(d.pad==='organ'||d.pad==='both')iOrgan(t,ch,bl,0.035,out);
    if(d.pad==='choir'||d.pad==='both')iChoir(t,[ch[0]+12,ch[1]+12,ch[2]],bl*1.05,0.05,out,d.vow);
    if(bar%2===0)iDrone(t,root-12,bl*2,0.07,out);
    if(d.toll&&bar%2===0)iBell(t,root,0.11,out,6);
  }
  if(d.bells&&s%2===0&&r()<d.bellP)iBell(t,d.bells[Math.floor(r()*d.bells.length)],0.04,out,3.5);
  if(d.pluck){
    if(d.pat===1&&[0,3,6,8,11,14].includes(s)){const n=[ch[0]+12,ch[1]+12,ch[2]+12,ch[1]+24][(s+bar)%4];iPluck(t,n,0.035,out);}
    if(d.pat===2&&s%2===0&&(bar%2===0||s<8)){const sc=d.pluck,i=(sc.length-1)-((s/2+bar*3)%sc.length);iPluck(t,sc[i],0.04,out);if(s===0)iPluck(t,ch[0],0.05,out);}
  }
}};}

];
const MENU_DEF={bpm:84,prog:[38,34,36,33],riff:'X.......x.x.X...',kick:'x.......x.x.....',menu:true};
function mkMetal(d){return{bpm:d.bpm,play(step,t,spb,out){
  const bar=Math.floor(step/16),s=step%16,root=d.prog[bar%d.prog.length],hot=!d.menu&&B&&B.phase===2,intro=!d.menu&&bar<1;
  const c=d.riff[s];
  if(c==='x')iGtr(t,root,spb*0.9,0.075,out,true);
  if(c==='X')iGtr(t,root,spb*(d.menu?7:4),0.09,out,false);
  if(c!=='.')iBass(t,root-12,spb*(c==='X'?3:0.9),0.12,out);
  if(!intro&&d.kick[s]==='x')iKick(t,0.55,out);
  if(hot&&!d.menu&&s%2===1)iKick(t,0.4,out);
  if(d.menu?s===8:(s===4||s===12))iSnare(t,0.32,out);
  if(s%(hot?1:2)===0)iHat(t,0.05,out,s===0);
  if(s===0){const q=bar%4===3?'M':'m';iChoir(t,triad(root+24,q).concat(hot?[root+36]:[]),16*spb*1.02,d.menu?0.07:0.055,out,bar%2?'o':'a');
    if(d.menu)iOrgan(t,triad(root+12,q),16*spb,0.03,out);
    if(d.bell)iBell(t,root+12,0.12,out,4);
    if(bar%4===0)iNoise(t,1.4,0.1,out,'highpass',5000);}
}};}

function wantedTrack(){
  if(scene==='title'||scene==='end'||(scene==='settings'&&retScene==='title')||!L)return'menu';
  if(scene==='dead')return null;
  if(B&&B.active&&!B.dead)return'b'+L.z;
  return'z'+L.z;
}
function musicSwitch(id){
  const t=AC.currentTime;
  if(MUS.bus){const old=MUS.bus;old.gain.cancelScheduledValues(t);old.gain.setValueAtTime(old.gain.value,t);old.gain.linearRampToValueAtTime(0.0001,t+1.2);setTimeout(()=>{try{old.disconnect();}catch(e){}},1600);}
  MUS.id=id;MUS.tr=TRACKS[id]||null;MUS.step=0;MUS.next=t+0.15;MUS.bus=null;
  if(MUS.tr){MUS.bus=AC.createGain();MUS.bus.gain.setValueAtTime(0.0001,t);MUS.bus.gain.linearRampToValueAtTime(1,t+(id&&id[0]==='b'?0.3:1.5));MUS.bus.connect(musBus);}
}
function musicUpdate(){
  if(!AC||AC.state!=='running')return;
  const want=wantedTrack();if(want!==MUS.id)musicSwitch(want);
  if(!MUS.tr||CFG.mus===0)return;
  const spb=60/MUS.tr.bpm/4;if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+0.05;
  let n=0;while(MUS.next<AC.currentTime+0.3&&n<8){try{MUS.tr.play(MUS.step,MUS.next,spb,MUS.bus);}catch(e){}MUS.next+=spb;MUS.step++;n++;}
}

function buildLevel(z){
  const d=ZONES[z],w=d.w,h=d.h,t=new Uint8Array(w*h);
  for(const[x0,x1,top]of d.ground)for(let x=x0;x<x1;x++)for(let y=top;y<h;y++)t[y*w+x]=1;
  for(const[x,y,len]of d.plats)for(let i=0;i<len;i++)t[y*w+x+i]=2;
  for(let y=0;y<h;y++){t[y*w]=1;t[y*w+w-1]=1;}
  return{z,d,w,h,t,pw:w*T,ph:h*T};
}

}

const isFree=()=>P.state==='idle'||P.state==='run'||P.state==='air';
function spend(n){P.st-=n;P.stDelay=34;}
function tryRoll(mv){
  if(buf.roll>0&&P.st>0&&P.onGround){S(P,'roll');spend(20);P.face=mv||P.face;buf.roll=0;sfx('roll');return true;}return false;
}
function updPlayer(){
  const p=P;p.anim++;p.t++;
  if(p.iframes>0)p.iframes--;if(p.dropping>0)p.dropping--;
  if(p.stDelay>0)p.stDelay--;else if(p.state!=='atk'&&p.state!=='hatk'&&p.state!=='roll')p.st=Math.min(maxST(),p.st+(p.state==='heal'?0.4:1.05));
  p.hpLag+=(p.hp<p.hpLag)?-Math.max(0.25,(p.hpLag-p.hp)*0.03):(p.hp-p.hpLag);
  const mv=(keys.right?1:0)-(keys.left?1:0);
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(isFree()){
    if(mv!==0)p.face=mv;
    p.vx+=(mv*1.8-p.vx)*(p.onGround?0.35:0.16);
    if(buf.jump>0&&p.coyote>0){
      if(keys.down&&onOneWay(p)){p.dropping=12;p.y+=1;}
      else{p.vy=-6;p.coyote=0;sfx('jump');puff(p.x+6,p.y+p.h,3,'#8a7f70',{sp:.6,life:14,g:0});}
      buf.jump=0;
    }
    if(!keys.jump&&p.vy<-2)p.vy=-2;
    if(tryRoll(mv)){}
    else if(buf.atk>0&&p.st>0){S(p,'atk');spend(14);buf.atk=0;p.hitSet=new Set();sfx('swing');}
    else if(buf.heavy>0&&p.st>0&&p.onGround){S(p,'hatk');spend(28);buf.heavy=0;p.hitSet=new Set();}
    else if(pressed.heal&&p.onGround){if(p.flasks>0){S(p,'heal');p.flasks--;}else{sfx('deny');msgBox={text:tr('empty'),t:120};}}
    if(isFree())p.state=p.onGround?(Math.abs(p.vx)>0.3?'run':'idle'):'air';
  }else if(p.state==='roll'){
    p.vx=p.face*(p.t<16?3.4:1.1);
    if(p.t%5===0&&p.onGround)puff(p.x+6,p.y+p.h,1,'#7a7060',{sp:.4,life:12,g:0});
    if(p.t>=24)endAct();
  }else if(p.state==='atk'){
    if(p.onGround)p.vx*=0.7;
    if(p.t===6&&p.onGround)p.vx=p.face*1.4;
    if(p.t>=7&&p.t<=11)playerHit(30,22,lightDmg(),false);
    if(p.t>=15&&buf.atk>0&&p.st>0){S(p,'atk');spend(14);buf.atk=0;p.hitSet=new Set();sfx('swing');}
    else if(p.t>=15&&tryRoll(mv)){}
    else if(p.t>=23)endAct();
  }else if(p.state==='hatk'){
    p.vx*=0.7;
    if(p.t===19){p.vx=p.face*2.4;sfx('swing2');}
    if(p.t>=20&&p.t<=26)playerHit(38,30,heavyDmg(),true);
    if(p.t>=34&&tryRoll(mv)){}
    else if(p.t>=44)endAct();
  }else if(p.state==='heal'){
    p.vx*=0.6;
    if(p.t===26){p.hp=Math.min(maxHP(),p.hp+Math.round(maxHP()*0.45));p.hpLag=Math.max(p.hpLag,p.hp);sfx('heal');puff(p.x+6,p.y+12,14,'#ffb050',{sp:1,up:.8,g:-.02,glow:true,life:30});}
    if(p.t>=44)endAct();
  }else if(p.state==='hurt'){
    p.vx*=0.9;if(p.t>=16)endAct();
  }else if(p.state==='dead'){p.vx*=0.9;}
  p.vy=Math.min(p.vy+GRAV,8);
  const wasG=p.onGround;
  moveBody(p);
  if(!wasG&&p.onGround&&p.state!=='dead')puff(p.x+6,p.y+p.h,4,'#8a7f70',{sp:.8,life:14,g:0});
  if(p.onGround&&!G.fight&&tileAt(Math.floor(p.x/T),Math.floor((p.y+p.h+1)/T))===1&&tileAt(Math.floor((p.x+p.w)/T),Math.floor((p.y+p.h+1)/T))===1)
    p.lastSafe={x:p.x+p.w/2,y:p.y+p.h};
  if(p.y>L.ph+30&&p.alive)killPlayer(true);
}
function endAct(){S(P,P.onGround?'idle':'air');}
function onOneWay(p){const ty=Math.floor((p.y+p.h+1)/T);const a=tileAt(Math.floor((p.x+1)/T),ty),b=tileAt(Math.floor((p.x+p.w-1)/T),ty);return(a===2||a===0)&&(b===2||b===0)&&(a===2||b===2);}

function enemyStrike(e,range,h,dmg,yoff=0){
  if(e.hitDone)return;const box={x:e.face>0?e.x+e.w:e.x-range,y:e.y+e.h/2-h/2+yoff-2,w:range,h};
  if(overlap(box,P)&&hurtPlayer(dmg,e.x+e.w/2))e.hitDone=true;
}
function hitEnemy(e,dmg,heavy){
  const ecx=e.x+e.w/2,pdir=(P.x+P.w/2)<ecx?1:-1;
  if(e.type==='knight'&&!heavy&&e.state!=='hurt'&&e.state!=='strike'&&e.state!=='wind'&&e.face===-pdir){
    sfx('clang');puff(ecx-pdir*8,e.y+12,8,'#ffe9a0',{sp:2,life:14,g:0,glow:true});
    P.vx=-pdir*2.6;spend(10);hitstop=2;e.vx=pdir*0.6;return;
  }
  e.hp-=dmg;e.flash=6;hitstop=heavy?5:3;sfx('hit');
  blood(ecx,e.y+e.h/2,heavy?16:9,pdir,e.onGround||e.fly?(e.fly?null:e.y+e.h):null);
  if(e.hp<=0){killEnemy(e);return;}
  if(e.type==='knight'||e.type==='bell'){if(heavy){e.broken=e.state!=='strike';S(e,'hurt');e.vx=pdir*1.6;}}
  else{S(e,'hurt');e.vx=pdir*(heavy?2.6:1.4);if(e.fly)e.vy=-0.6;if(e.type==='dog')e.vy=-1.5;}
  e.aggro=240;
}
function killEnemy(e){
  e.dead=true;e.dieT=0;G.souls+=e.souls;soulStream(e.x+e.w/2,e.y+e.h/2,6);
  puff(e.x+e.w/2,e.y+e.h/2,12,'#3a3430',{sp:1.2,up:.5,g:-.01,life:40});sfx('souls');
}
function updEnemy(e){
  if(e.dead){if(e.dieT<60)e.dieT++;return;}
  e.t++;e.anim++;if(e.flash>0)e.flash--;if(e.cd>0)e.cd--;if(e.cd2>0)e.cd2--;
  const ecx=e.x+e.w/2,ecy=e.y+e.h/2,pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  const dx=pcx-ecx,dy=pcy-ecy,adx=Math.abs(dx),dir=dx>0?1:-1;
  if(P.alive&&adx<170&&Math.abs(dy)<80)e.aggro=200;else if(e.aggro>0)e.aggro--;
  const ag=e.aggro>0&&P.alive;
  const walkTo=(sp)=>{e.vx=dir*sp;if(e.state==='idle')e.state='walk';if(ledgeAhead(e,dir)||wallAhead(e,dir))e.vx=0;};
  const idle=()=>{e.vx=0;e.state='idle';};
  switch(e.type){
  case'hollow':
    switch(e.state){
    case'hurt':e.vx*=0.85;if(e.t>=18)S(e,'idle');break;
    case'wind':e.vx=0;if(e.t>=e.wind){S(e,'strike');sfx('swing');}break;
    case'strike':e.vx=e.t<4?e.face*1.6:0;if(ledgeAhead(e,e.face))e.vx=0;if(e.t<=7)enemyStrike(e,24,18,e.dmg);if(e.t>=8)S(e,'rec');break;
    case'rec':e.vx=0;if(e.t>=28)S(e,'idle');break;
    default:
      if(ag){e.face=dir;if(adx<28&&e.cd<=0){S(e,'wind');e.wind=rint(20,30);e.cd=40;e.vx=0;}else if(adx>20)walkTo(e.spd);else e.vx=0;}
      else{idle();if(e.t>150){e.t=0;e.face*=-1;}}
    }break;
  case'knight':
    switch(e.state){
    case'hurt':e.vx*=0.85;if(e.t>=(e.broken?50:14)){e.broken=false;S(e,'idle');}break;
    case'wind':e.vx=0;if(e.t>=e.wind){S(e,'strike');sfx('swing');}break;
    case'strike':e.vx=e.t<5?e.face*2.2:0;if(ledgeAhead(e,e.face))e.vx=0;if(e.t<=6)enemyStrike(e,32,12,e.dmg,-2);
      if(e.t>=10){e.n++;if(e.n<2){S(e,'wind');e.wind=14;}else{e.n=0;S(e,'rec');}}break;
    case'rec':e.vx=0;if(e.t>=40)S(e,'idle');break;
    default:
      if(ag){e.face=dir;if(adx<36&&e.cd<=0){S(e,'wind');e.wind=30;e.cd=70;e.n=0;}else if(adx>28)walkTo(e.spd);else e.vx=0;}
      else idle();
    }break;
  case'archer':
    switch(e.state){
    case'hurt':e.vx*=0.85;if(e.t>=14)S(e,'idle');break;
    case'draw':e.vx=0;e.face=dir;if(e.t>=36){
        PR.push({kind:'arrow',x:e.face>0?e.x+e.w:e.x-10,y:e.y+12,w:10,h:2,vx:e.face*3.6,vy:clamp(dy/Math.max(20,adx/3.6),-.8,.8),life:150,dmg:e.dmg});
        sfx('shoot');S(e,'rec');e.cd=rint(90,140);}break;
    case'rec':e.vx=0;if(e.t>=20)S(e,'idle');break;
    default:
      e.vx=0;
      if(ag){e.face=dir;if(adx<44&&!ledgeAhead(e,-dir)&&!wallAhead(e,-dir)){e.vx=-dir*0.7;}
        if(adx<230&&e.cd<=0&&Math.abs(dy)<70)S(e,'draw');}
    }break;
  case'dog':
    switch(e.state){
    case'hurt':e.vx*=0.85;if(e.t>=14)S(e,'idle');break;
    case'lungeW':e.vx=0;if(e.t>=14){S(e,'lunge');e.vx=e.face*3.6;e.vy=-3.2;}break;
    case'lunge':if(!e.hitDone&&overlap(e,P)&&hurtPlayer(e.dmg,ecx))e.hitDone=true;if(e.t>4&&e.onGround)S(e,'rec');break;
    case'rec':e.vx*=0.7;if(e.t>=30)S(e,'idle');break;
    default:
      if(ag){e.face=dir;if(adx<80&&e.cd<=0&&e.onGround&&Math.abs(dy)<30){S(e,'lungeW');e.cd=70;}else if(adx>22)walkTo(e.spd);else e.vx=0;}
      else idle();
    }break;
  case'nun':

  if(b.dead){b.dieT++;if(b.dieT<80&&b.dieT%2===0)puff(b.x+rnd(0,b.w),b.y+rnd(0,b.h),2,'#ffd27a',{sp:.6,up:1,g:-.02,glow:true,life:40});return;}
  if(!b.active)return;
  b.t++;if(b.flash>0)b.flash--;
  b.hpLag+=(b.hp-b.hpLag)*(b.hp<b.hpLag?0.03:1);
  const cx=b.x+b.w/2,dx=(P.x+P.w/2)-cx,adx=Math.abs(dx);
  if(b.phase===1&&b.hp<b.maxhp*0.5){b.phase=2;shake(10);sfx('roar');
    puff(cx,b.y+b.h/2,24,b.kind==='guardian'?'#9fe8ff':b.kind==='cardinal'||b.kind==='abbess'?'#ffd27a':'#ff7a30',{sp:2.5,glow:true,g:0,life:40});
    if(b.kind==='cardinal'){const gy=b.y+b.h;b.onFoot=true;b.w=22;b.h=48;b.x=cx-11;b.y=gy-48;b.vx=0;S(b,'rise');
      puff(cx,gy-20,30,'#c9a24a',{sp:3,life:40,g:.15});puff(cx,gy-20,20,'#5a1010',{sp:3,life:40,g:.15});
      banner={text:tr('lektyka'),sub:tr('lektykaS'),col:'#e6c56a',t:0,dur:140,small:true};}
  }
  BOSS_AI[b.kind](b,dx,adx,b.phase===2);
  if(b.float){b.hitWall=0;b.x+=b.vx;b.y=b.baseY+(b.yOff||0)+Math.sin(time*0.05)*3;}
  else{b.vy=Math.min(b.vy+GRAV,9);moveBody(b);}
  const ax0=arenaX0(),ax1=L.pw-T;
  if(b.x<ax0){b.x=ax0;b.hitWall=-1;}if(b.x+b.w>ax1){b.x=ax1-b.w;b.hitWall=1;}
  if(b.contact&&overlap(b,P))hurtPlayer(b.contact,cx);
}

function updProj(){
  const add=[];
  for(const pr of PR){
    if(pr.kind==='pillar'){pr.t++;
      if(pr.t===pr.warn&&pr.warn>0){sfx('fire');shake(3);}
      if(pr.t>=pr.warn&&pr.t<pr.warn+pr.act){if(overlap(pr,P))hurtPlayer(pr.dmg,pr.x+pr.w/2);if(pr.t%3===0)puff(pr.x+rnd(0,pr.w),pr.y+pr.h-rnd(0,pr.h),1,pr.gold?'#ffe7a0':'#ffb040',{sp:.5,up:1.5,g:-.03,glow:true,life:20});}
      if(pr.t>=pr.warn+pr.act)pr.dead=true;continue;}
    if(pr.kind==='ring'){if(pr.delay>0){pr.delay--;continue;}pr.r+=pr.sp;if(pr.r>pr.max)pr.dead=true;
      const d=Math.hypot(P.x+P.w/2-pr.x,P.y+P.h/2-pr.y);if(!pr.hit&&Math.abs(d-pr.r)<7&&hurtPlayer(pr.dmg,pr.x))pr.hit=true;continue;}
    if(pr.grav)pr.vy+=pr.grav;
    if(pr.kind==='halo')pr.vx-=pr.dir*0.085;
    pr.x+=pr.vx;pr.y+=pr.vy;if(--pr.life<=0)pr.dead=true;
    const cx=Math.floor((pr.x+pr.w/2)/T),cy=Math.floor((pr.y+pr.h/2)/T);
    if(pr.kind!=='halo'&&tileAt(cx,cy)===1){pr.dead=true;
      if(pr.kind==='wax'){const top=cy*T;add.push({kind:'pillar',x:pr.x-5,y:top-16,w:14,h:16,warn:0,act:80,t:0,dmg:pr.fdmg||10,flame:true});}
      else if(pr.kind!=='wave'&&pr.kind!=='shock'&&pr.kind!=='shriek')puff(pr.x,pr.y,4,pr.kind==='arrow'?'#c8b48a':pr.kind==='tear'?'#ffe08a':'#ff9a40',{sp:1,life:12,glow:pr.kind!=='arrow'});}
    if(pr.kind==='wave'&&time%3===0)puff(pr.x+pr.w/2,pr.y+2,1,'#cfeef8',{sp:.6,up:.8,life:16});
    if(!pr.dead&&overlap(pr,P)&&hurtPlayer(pr.dmg,pr.x+pr.w/2-pr.vx*10)){if(pr.kind!=='wave'&&pr.kind!=='shock'&&pr.kind!=='shriek'&&pr.kind!=='halo')pr.dead=true;}
  }
  PR=PR.filter(p=>!p.dead).concat(add);
}

function render(){
  ctx=MAIN;ctx.setTransform(CFG.res,0,0,CFG.res,0,0);ctx.imageSmoothingEnabled=false;UIH=[];
  const sc=scene;
  if(sc==='title'||(sc==='settings'&&retScene==='title'))drawTitle(sc==='settings');
  else if(sc==='end')drawEnd();
  else{
    drawBG(L.z);
    const sx=shakeM?rnd(-shakeM,shakeM):0,sy=shakeM?rnd(-shakeM,shakeM):0;

  }

}
function drawFade(){if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,VW,VH);}}

// ================== PĘTLA ==================
let acc=0,last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last);last=now;fpsN++;if(now-fpsT>1000){fpsV=fpsN;fpsN=0;fpsT=now;}
  let n=0;while(acc>=1000/60&&n<5){step();acc-=1000/60;n++;}
  if(n===5)acc=0;
  try{render();}catch(e){ctx=MAIN;console.error(e);}
  requestAnimationFrame(frame);
}
newGame();
requestAnimationFrame(frame);
cv.focus();
